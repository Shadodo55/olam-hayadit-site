# Lightweight rebuild when content changes in Sanity (triggered by a Sanity
# webhook -> repository_dispatch "sanity-publish"). Build + deploy only: no
# Playwright or Lighthouse, to save Actions minutes. Rapid successive edits
# cancel the in-progress run, so many quick edits end in a single deploy.
name: Content deploy

on:
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

concurrency:
  group: content-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'http://localhost:3000' }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: gntr6ikv
      NEXT_PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
